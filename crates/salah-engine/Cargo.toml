[package]
name = "salah-engine"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
description = "Explicit orchestration of a selected location and local prayer schedule"
publish = false

[dependencies]
salah-core = { path = "../salah-core" }
salah-location = { path = "../salah-location" }
salah-time = { path = "../salah-time" }
salah-update = { path = "../salah-update" }
# Versioned output adapter only; already pinned by salah-time. No network I/O.
serde_json = "=1.0.151"
