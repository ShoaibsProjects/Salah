[package]
name = "salah-bridge"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
description = "Shared explicit JSON operations for native and WebAssembly Salah clients"
publish = false

[dependencies]
salah-core = { path = "../salah-core" }
salah-engine = { path = "../salah-engine" }
salah-location = { path = "../salah-location" }
salah-time = { path = "../salah-time" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
