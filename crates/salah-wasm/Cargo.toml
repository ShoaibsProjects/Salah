[package]
name = "salah-wasm"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
description = "Explicit JSON bridge to the Salah engine for browser WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
salah-core = { path = "../salah-core" }
salah-engine = { path = "../salah-engine" }
salah-location = { path = "../salah-location" }
salah-time = { path = "../salah-time" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.129"
