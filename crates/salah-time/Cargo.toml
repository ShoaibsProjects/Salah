[package]
name = "salah-time"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Offline IANA civil-time pack, selector, and local prayer schedule"
publish = false

[dependencies]
salah-core = { path = "../salah-core" }
# Pinned exactly. Default features are OFF: no host zoneinfo lookup
# (tzdb-zoneinfo/tzdb-concatenated), no bundled database
# (tzdb-bundle-platform/tzdb-bundle-always), and no implicit system
# time-zone detection (tz-system). Only `std` (which implies `alloc`,
# required for TimeZone::tzif) is enabled, so conversion works purely
# from caller-supplied bytes plus CPU arithmetic.
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }

# Shared integrity validation for immutable runtime snapshots; authentication
# remains in salah-update. These versions already exist in the lockfile.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
